# Publishes the game to GitHub Pages. The site is plain static files - no build step, no
# dependencies - so this workflow just uploads the repository as-is.
#
# Required once, in the repo's Settings -> Pages: set "Source" to "GitHub Actions".
# (If you'd rather use "Deploy from a branch", you can: pick this branch and the / (root)
# folder, and this workflow becomes unnecessary.)

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/doodle-fps-game-bots-vm4ieu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
